<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered text summarizer using Hugging Face Transformers. Paste any content and get a quick, intelligent summary.">
    <title>Text Summarizer – AI Powered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            color: #1c1c1e;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
            margin: 3rem auto;
            padding: 2.5rem 2rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(251, 146, 60, 0.12), 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: #fb923c;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.4rem 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0 0 1.2rem 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
            margin: 0 0 1.8rem 0;
            line-height: 1.6;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #f3f4f6;
            margin-bottom: 1.8rem;
        }

        form#summarization-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        textarea#dialogue-input {
            width: 100%;
            min-height: 160px;
            padding: 1rem 1.1rem;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 0.95rem;
            color: #1c1c1e;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            line-height: 1.6;
        }

        textarea#dialogue-input:focus {
            border-color: #fb923c;
            box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.15);
            background: #ffffff;
        }

        textarea#dialogue-input::placeholder {
            color: #9ca3af;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: linear-gradient(135deg, #fb923c, #f97316);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.45);
            opacity: 0.95;
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
        }

        #summary-output {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1.3rem 1.5rem;
            background: #fff7ed;
            border: 1.5px solid #fed7aa;
            border-radius: 12px;
            text-align: left;
        }

        #summary-heading {
            margin: 0 0 0.6rem 0;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #fb923c;
        }

        #summary {
            margin: 0;
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.7;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <p class="subtitle">Using Hugging Face Transformers</p>
        <p class="description">Paste or type any content below and get an intelligent, concise summary in seconds.</p>
        <div class="divider"></div>

        <form id="summarization-form">
            <textarea name="dialogue" id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit" id="submit-btn">Summarize</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary">Summarized content will appear here.</p>
        </div>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e)=>{
            e.preventDefault();

            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary");
            const submitButton = document.getElementById("submit-btn");

            const dialogue = dialogueInput.value.trim();
            if(!dialogue) return;

            // show processing message and disable button
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;

            try {
                // Determine backend URL (fallback to local FastAPI port 8000 if using Live Server or file://)
                let backendUrl = "/summarize";
                if (window.location.protocol === "file:" || (window.location.hostname === "127.0.0.1" && window.location.port !== "8000") || (window.location.hostname === "localhost" && window.location.port !== "8000")) {
                    backendUrl = "http://127.0.0.1:8000/summarize";
                }

                // send dialogue to backend
                const response = await fetch(backendUrl,{
                    method:"POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({dialogue})
                })

                if(!response.ok) throw new Error(`Server Error: ${response.statusText}`);

                const data = await response.json();
                summaryText.innerText = data.summary || "Summary not generated.";
                
                
            } catch (error) {
                summaryText.innerText = "An error occured: " + error.message;
            } finally {
                submitButton.disabled = false;
            }
        })

    </script>
</body>
</html>
